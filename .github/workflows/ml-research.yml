name: ML signal research
on:
  pull_request:
    paths: ['research/**', '.github/workflows/ml-research.yml']
  push:
    branches: ['claude/hobby-project-app-webapp-nmtkai']
    paths: ['research/**', '.github/workflows/ml-research.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest research.test_signal_ranker -v
      - run: python -m research.signal_ranker
