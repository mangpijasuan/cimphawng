# Database migrations. The API applies them itself on start-up; this file is for running Alembic by hand,
# e.g. `alembic revision --autogenerate -m "..."` after changing app/models.py. The database URL comes from
# CIMP_DATABASE_URL (or .env), the same setting the API uses.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
